<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Multilevel tayyorgarlik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f5;--card:#fff;--ink:#14303b;--mute:#5b7480;--line:#d5e0e5;--acc:#0e7c8b;--mark:#f6c945;--ok:#2f8f5b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c22;--card:#172830;--ink:#e6f0f3;--mute:#93aab4;--line:#294451;--acc:#4fc3d3;--mark:#e5b93a;--ok:#5cc489;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c22;--card:#172830;--ink:#e6f0f3;--mute:#93aab4;--line:#294451;--acc:#4fc3d3;--mark:#e5b93a;--ok:#5cc489;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:"Bricolage Grotesque",Manrope,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;line-height:1.15}
h2{font-size:19px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.count{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.big{font:800 44px/1 "Bricolage Grotesque",Manrope,sans-serif;background:linear-gradient(transparent 62%,var(--mark) 62%);padding:0 4px}
.mute{color:var(--mute);font-size:14px}
input[type=date],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:64px;text-align:center;padding:2px 4px}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.task:first-of-type{border-top:0}
.task input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:26px;height:26px;border:2px solid var(--acc);border-radius:8px;display:grid;place-items:center}
.task input:checked+.box{background:var(--ok);border-color:var(--ok)}
.task input:checked+.box::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task input:checked~span:last-child{color:var(--mute);text-decoration:line-through}
.task input:focus-visible+.box{outline:3px solid var(--mark);outline-offset:2px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .25s}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btns{display:flex;gap:8px}
button{font:600 15px Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.prog+.prog{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.week{display:flex;justify-content:space-between;margin-top:10px}
.day{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--mute)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.dot.part{background:var(--mark);border-color:var(--mark)}
.dot.full{background:var(--ok);border-color:var(--ok)}
.day.today{color:var(--ink);font-weight:700}
.day.today .dot{border-color:var(--acc)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Multilevel tayyorgarlik</h1>
  <div id="app"></div>
</main>
<script>
var K="mlt-tracker-v1";
var TASKS=["Foundation: 1 ta mavzu","Vocabulary in Use: 1 ta unit","Yangi soʻzlarni takrorlash"];
var FOCUS=["Yengil takrorlash kuni","Listening","Reading","Writing","Speaking","Mock Tests dan 1 ta qism","Zaif joylarni takrorlash"];
var DAYN=["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
var SH=["Ya","Du","Se","Ch","Pa","Ju","Sh"];
function def(){return {exam:"",fT:70,fD:0,vT:100,vD:0,days:{}}}
function fix(s){if(!s.v2){if(s.fT===30)s.fT=70;s.v2=1}return s}
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function loadLocal(){try{var r=localStorage.getItem(K);return r?fix(Object.assign(def(),JSON.parse(r))):null}catch(e){return null}}
var S=loadLocal()||def(), remote=null, tm=null, chain=Promise.resolve();
function persist(){
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  clearTimeout(tm);
  tm=setTimeout(function(){
    if(!remote)return;
    var ks=Object.keys(S.days).sort(),c=JSON.parse(JSON.stringify(S));
    while(ks.length>90){delete c.days[ks.shift()]}
    try{remote.setItem("state",JSON.stringify(c),function(){})}catch(e){}
  },400);
}
function arr(key){var a=S.days[key];return a&&a.length===4?a:[0,0,0,0]}
function sum(a){return a[0]+a[1]+a[2]+a[3]}
function pct(a,b){return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0}
function streak(){
  var d=new Date(),n=0;
  if(sum(arr(ymd(d)))===4)n++;
  d.setDate(d.getDate()-1);
  while(sum(arr(ymd(d)))===4){n++;d.setDate(d.getDate()-1)}
  return n;
}
function render(){
  var now=new Date(),today=ymd(now),dow=now.getDay(),a=arr(today),done=sum(a);
  var left="";
  if(S.exam){
    var t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var n=Math.ceil((new Date(S.exam+"T00:00:00")-t0)/864e5);
    left=n>0?'<span class="big">'+n+'</span> <span>kun qoldi</span>':(n===0?'<span class="big">Bugun</span> <span>imtihon kuni</span>':'<span>Imtihon sanasi oʻtib ketgan</span>');
  }else{left='<span>Imtihon sanasini tanla</span>'}
  var h='<section class="card"><div class="count"><div>'+left+'</div><div class="mute">Imtihon sanasi<br>'+examPick()+'</div></div></section>';
  h+='<section class="card"><h2>Bugun, '+DAYN[dow]+'</h2><p class="mute" style="margin:2px 0 6px">Bugungi skill: '+FOCUS[dow]+'</p>';
  var labels=TASKS.concat(["Skill mashqi: "+FOCUS[dow]]);
  for(var i=0;i<4;i++){
    h+='<label class="task"><input type="checkbox" data-act="tick" data-i="'+i+'"'+(a[i]?" checked":"")+'><span class="box"></span><span>'+labels[i]+'</span></label>';
  }
  h+='<div class="bar"><i style="width:'+pct(done,4)+'%"></i></div><div class="ph"><span class="mute">'+done+' / 4 bajarildi</span><span class="mute">Ketma-ket kunlar: <b>'+streak()+'</b></span></div></section>';
  h+='<section class="card"><h2>Kitoblar boʻyicha jarayon</h2>';
  h+=prog("Foundation mavzulari","fD","fT","mavzu");
  h+=prog("Vocabulary in Use unitlari","vD","vT","unit");
  h+='</section>';
  h+='<section class="card"><h2>Oxirgi 7 kun</h2><div class="week">';
  for(var j=6;j>=0;j--){
    var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-j),s=sum(arr(ymd(d)));
    h+='<div class="day'+(j===0?" today":"")+'"><div class="dot'+(s===4?" full":(s>0?" part":""))+'"></div>'+SH[d.getDay()]+'</div>';
  }
  h+='</div></section>';
  document.getElementById("app").innerHTML=h;
}
function prog(name,dk,tk,unit){
  return '<div class="prog"><div class="ph"><b>'+name+'</b><span class="mute">'+S[dk]+' / <input type="number" min="1" max="999" data-act="total" data-k="'+tk+'" value="'+S[tk]+'" aria-label="Jami '+unit+'"></span></div>'+
  '<div class="bar"><i style="width:'+pct(S[dk],S[tk])+'%"></i></div>'+
  '<div class="btns"><button data-act="adj" data-k="'+dk+'" data-t="'+tk+'" data-d="-1">−1</button><button data-act="adj" data-k="'+dk+'" data-t="'+tk+'" data-d="1">+1 '+unit+'</button></div></div>';
}
function examPick(){
  var m=S.exam?Number(S.exam.slice(5,7)):(S.em||0),d=S.exam?Number(S.exam.slice(8,10)):(S.ed||0);
  var M=["Oy","Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
  var o='<select data-act="em" aria-label="Oy">';
  for(var i=0;i<13;i++)o+='<option value="'+i+'"'+(i===m?" selected":"")+'>'+M[i]+'</option>';
  o+='</select> <select data-act="ed" aria-label="Kun"><option value="0">Kun</option>';
  for(var k=1;k<=31;k++)o+='<option value="'+k+'"'+(k===d?" selected":"")+'>'+k+'</option>';
  return o+'</select>';
}
function bump(k,t,d){S[k]=Math.max(0,Math.min(S[t],S[k]+d))}
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-act=adj]");
  if(!b)return;
  bump(b.dataset.k,b.dataset.t,Number(b.dataset.d));
  persist();render();
});
document.addEventListener("change",function(e){
  var el=e.target,act=el.dataset.act;
  if(act==="tick"){
    var key=ymd(new Date()),a=arr(key).slice(),i=Number(el.dataset.i);
    a[i]=el.checked?1:0;S.days[key]=a;
    if(i===0)bump("fD","fT",el.checked?1:-1);
    if(i===1)bump("vD","vT",el.checked?1:-1);
  }else if(act==="em"||act==="ed"){
    var cur=S.exam?{m:Number(S.exam.slice(5,7)),d:Number(S.exam.slice(8,10))}:{m:S.em||0,d:S.ed||0};
    if(act==="em")cur.m=Number(el.value);else cur.d=Number(el.value);
    S.em=cur.m;S.ed=cur.d;S.exam="";
    if(cur.m&&cur.d){
      var nw=new Date(),y=nw.getFullYear();
      if(cur.m<nw.getMonth()+1||(cur.m===nw.getMonth()+1&&cur.d<nw.getDate()))y++;
      cur.d=Math.min(cur.d,new Date(y,cur.m,0).getDate());
      S.exam=y+"-"+(cur.m<10?"0":"")+cur.m+"-"+(cur.d<10?"0":"")+cur.d;
    }
  }else if(act==="total"){
    var v=Math.round(Number(el.value));
    S[el.dataset.k]=v>0?Math.min(v,999):S[el.dataset.k];
    S.fD=Math.min(S.fD,S.fT);S.vD=Math.min(S.vD,S.vT);
  }else return;
  persist();render();
});
render();
(function(){
  try{
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(!tg)return;
    tg.ready();tg.expand();
    var cs=tg.CloudStorage;
    if(!cs||!cs.getItem)return;
    cs.getItem("state",function(err,val){
      if(!err&&val){try{S=fix(Object.assign(def(),JSON.parse(val)));try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()}catch(e){}}
      remote=cs;
    });
  }catch(e){}
})();
</script>
</body>
</html>
